# Reviewed bootstrap drop-in; never installed automatically by an artifact.
[Service]
WorkingDirectory=/opt/google-meet-bot/current
ExecStart=
ExecStart=/usr/bin/node /opt/google-meet-bot/current/dist/app.js
Environment=BOT_LIFECYCLE_SOCKET=/run/google-meet-bot/lifecycle.sock
Environment=BOT_RELEASE_FILE=/opt/google-meet-bot/current/RELEASE_SHA
RuntimeDirectory=google-meet-bot
RuntimeDirectoryMode=0700
TimeoutStopSec=150
SendSIGKILL=no
