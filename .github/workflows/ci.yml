# Generated by platform-infra/scripts/render-public-ci.py.
# Standalone equivalent: private reusable workflows are inaccessible here.
name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "codex/platform-*"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CI: 'true'
      YARN_ENABLE_SCRIPTS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.20.2'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', '.yarn/releases/*') }}
      - run: test "$(node .yarn/releases/yarn-3.1.0.cjs --version)" = 3.1.0
      - run: node .yarn/releases/yarn-3.1.0.cjs install --immutable
      - name: Quality checks
        run: "node .yarn/releases/yarn-3.1.0.cjs build"
      - run: git diff --exit-code
