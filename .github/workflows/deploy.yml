# Generated by platform-infra/scripts/render-public-cd.py.
# Canonical transport: platform-infra/.github/workflows/artifact-deploy.yml.
# Only the reviewed release helper is vendored; no private repository token.
name: Deploy verified artifact
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: production-artifact
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.PLATFORM_RELEASES_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      APP: google-meet-bot
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify the vendored platform helper
        run: |
          echo 'b683f39a0dfbbf3d9bf2ac321df41f9ff877bea0f178f5c20670e976e566c135  ops/vendor/release.py' | sha256sum --check
          echo "PLATFORM_RELEASE_HELPER=$GITHUB_WORKSPACE/ops/vendor/release.py" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: google-meet-bot-release-${{ github.event.workflow_run.run_attempt }}
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify source, platform and complete artifact
        run: |
          [[ "$APP" =~ ^[a-z][a-z0-9-]{1,40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          python3 "$PLATFORM_RELEASE_HELPER" verify --archive artifact/release.tar.gz \
            --descriptor artifact/release.json --app "$APP" --expected-sha "$SOURCE_SHA" \
            --expected-run-id "$SOURCE_RUN_ID" --expected-arch x64
      - name: Configure dedicated SSH identity
        id: current
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$latest" != "$SOURCE_SHA" ]]; then
            echo 'Superseded by a newer main revision; no deployment performed.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deliver to the registered host adapter
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          incoming="/var/lib/platform-deploy/$APP/incoming/$SOURCE_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote="$VPS_USER@$VPS_HOST"
          ssh_args=(-i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$VPS_PORT")
          # Interpolate the validated identity/path on the runner before SSH.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$remote" "install -d -m 700 '$incoming'"
          rsync -a -e "ssh -i $HOME/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p $VPS_PORT" \
            artifact/ "$remote:$incoming/"
          # Only the two files uploaded by this run are disposable. Failed deployments
          # retain their incoming files for inspection; releases/baselines are untouched.
          remove_incoming() {
            # shellcheck disable=SC2029
            ssh "${ssh_args[@]}" "$remote" \
              "rm -f -- '$incoming/release.tar.gz' '$incoming/release.json' && rmdir -- '$incoming'"
          }
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$latest" != "$SOURCE_SHA" ]]; then
            echo 'Main advanced during upload; no deployment performed.'
            remove_incoming
            exit 0
          fi
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$remote" \
            "sudo -n /usr/local/sbin/platform-release '$APP' '$incoming' '$SOURCE_SHA' '$SOURCE_RUN_ID'"
          remove_incoming
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy
